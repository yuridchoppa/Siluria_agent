<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Siluria AI — The Great Order</title>
    <script src="https://cdn.jsdelivr.net/npm/marked@4.3.0/marked.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=VT323&family=Cinzel:wght@500;700;900&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; }

        /* Login Modal Styles */
        #login-modal {
            display: none; position: fixed; inset: 0; z-index: 1000;
            background: rgba(8, 6, 3, 0.95); backdrop-filter: blur(12px);
            align-items: center; justify-content: center;
        }
        #login-modal.show { display: flex; animation: fadeInModal 0.4s ease; }
        @keyframes fadeInModal { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
        .login-box {
            background: rgba(20, 15, 8, 0.95); border: 1px solid var(--gold);
            padding: 40px; width: 100%; max-width: 400px;
            box-shadow: 0 0 50px rgba(229,193,88,0.15), inset 0 0 20px #000;
            text-align: center; border-radius: 2px; position: relative;
        }
        .login-box::before, .login-box::after {
            content: ''; position: absolute; width: 20px; height: 20px; border-color: var(--gold); border-style: solid; pointer-events: none;
        }
        .login-box::before { top: -2px; left: -2px; border-width: 2px 0 0 2px; }
        .login-box::after { bottom: -2px; right: -2px; border-width: 0 2px 2px 0; }
        .login-title { font-family: 'Cinzel', serif; font-size: 22px; color: var(--gold-bright); letter-spacing: 0.2rem; margin-bottom: 30px; text-shadow: 0 0 10px var(--gold-glow); }
        .login-input { width: 100%; background: transparent; border: none; border-bottom: 1px solid var(--border); color: var(--text-bright); font-family: 'VT323', monospace; font-size: 20px; padding: 10px; margin-bottom: 20px; outline: none; text-align: center; }
        .login-input:focus { border-bottom-color: var(--gold); }
        .btn-auth { background: rgba(229,193,88,0.1); border: 1px solid var(--border); color: var(--gold-bright); font-family: 'Cinzel', serif; font-size: 14px; padding: 12px 24px; cursor: pointer; transition: all 0.25s; width: 100%; letter-spacing: 0.15rem; margin-top: 10px; }
        .btn-auth:hover { background: rgba(229,193,88,0.3); border-color: var(--gold); color: #fff; box-shadow: 0 0 15px rgba(229,193,88,0.4); }
        .btn-close-modal { position: absolute; top: 15px; right: 15px; background: transparent; border: none; color: var(--text-muted); cursor: pointer; font-size: 18px; }
        .btn-close-modal:hover { color: var(--gold-bright); }

        :root {
            --bg:          #080603;
            --gold:        #e5c158;
            --gold-bright: #fff2a3;
            --gold-dim:    #8c7233;
            --gold-glow:   rgba(229, 193, 88, 0.45);
            --text-main:   #f5ebd4;
            --text-bright: #ffffff;
            --text-muted:  #b59e72;
            --panel:       rgba(14, 11, 6, 0.92);
            --panel-deep:  rgba(8, 6, 3, 0.96);
            --border:      rgba(229, 193, 88, 0.25);
            --border-hi:   rgba(229, 193, 88, 0.65);
            --red:         #9e1a1a;
            --red-bright:  #ff3838;
            --sidebar-w:   290px;
        }

        html, body {
            width: 100%; height: 100%;
            background: var(--bg);
            color: var(--text-main);
            font-family: 'VT323', monospace;
            font-size: 19px;
            overflow: hidden;
            display: flex;
        }

        /* ═══════════════════════════════
           SOULS FOG / SKY / ERDTREE BACKGROUND
           ═══════════════════════════════ */
        .bg-sky {
            position: fixed; inset: 0; z-index: 0; pointer-events: none;
            background:
                radial-gradient(ellipse 120% 60% at 50% 0%, #2b1a08 0%, #120c04 45%, #050402 100%),
                radial-gradient(ellipse 60% 40% at 50% 30%, rgba(229,193,88,0.12) 0%, transparent 70%);
        }

        .bg-fog {
            position: fixed; inset: 0; z-index: 1; pointer-events: none;
        }
        .fog-band {
            position: absolute; left: -10%; width: 120%;
            background: radial-gradient(ellipse at center, var(--col, rgba(45,30,10,0.5)) 0%, transparent 70%);
            animation: fogDrift var(--spd, 18s) ease-in-out infinite alternate;
            filter: blur(10px);
        }
        @keyframes fogDrift {
            0%   { transform: translateX(-4%) scaleY(1); opacity: var(--a0, 0.5); }
            100% { transform: translateX( 4%) scaleY(1.08); opacity: var(--a1, 0.85); }
        }

        .bg-erdtree {
            position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
            width: 4px; height: 100%;
            background: linear-gradient(to top, transparent 0%, rgba(229,193,88,0.1) 30%, rgba(255,240,160,0.35) 75%, transparent 100%);
            filter: blur(35px); z-index: 2; pointer-events: none;
            animation: erdtreePulse 8s ease-in-out infinite alternate;
        }
        .bg-erdtree-wide {
            position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
            width: 700px; height: 80%;
            background: radial-gradient(ellipse at 50% 100%, rgba(229,193,88,0.15) 0%, rgba(229,193,88,0.05) 45%, transparent 70%);
            filter: blur(40px); z-index: 2; pointer-events: none;
            animation: erdtreePulse 8s ease-in-out infinite alternate;
        }
        @keyframes erdtreePulse { 0% { opacity: 0.6; } 100% { opacity: 1; } }

        .layer-scanlines {
            position: fixed; inset: 0; z-index: 51; pointer-events: none;
            background: repeating-linear-gradient(to bottom, transparent 0px, transparent 2px, rgba(0,0,0,0.08) 2px, rgba(0,0,0,0.08) 4px);
        }
        .layer-vignette {
            position: fixed; inset: 0; z-index: 52; pointer-events: none;
            background: radial-gradient(ellipse at center, transparent 35%, rgba(0,0,0,0.5) 70%, rgba(0,0,0,0.92) 100%);
        }

        /* ═══════════════════════════════
           SIDEBAR — CHRONICLES (SESSIONS)
           ═══════════════════════════════ */
        #sidebar {
            width: var(--sidebar-w);
            height: 100%;
            background: var(--panel-deep);
            border-right: 1px solid var(--border);
            z-index: 80;
            display: flex;
            flex-direction: column;
            position: relative;
            backdrop-filter: blur(12px);
            box-shadow: 5px 0 25px rgba(0,0,0,0.8);
            transition: transform 0.3s ease;
        }

        .sidebar-header {
            padding: 18px 16px 14px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .sidebar-title {
            font-family: 'Cinzel', serif;
            font-size: 16px;
            letter-spacing: 0.2rem;
            color: var(--gold-bright);
            text-shadow: 0 0 10px var(--gold-glow);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .sidebar-title span { font-size: 18px; color: var(--gold); }

        .btn-new-session {
            background: rgba(229,193,88,0.08);
            border: 1px solid var(--border);
            color: var(--gold-bright);
            font-family: 'Cinzel', serif;
            font-size: 12px;
            letter-spacing: 0.12rem;
            padding: 9px 14px;
            margin: 12px 14px 6px;
            cursor: pointer;
            border-radius: 2px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.25s ease;
        }
        .btn-new-session:hover {
            background: rgba(229,193,88,0.22);
            border-color: var(--gold);
            box-shadow: 0 0 15px rgba(229,193,88,0.3);
            transform: translateY(-1px);
        }

        #sessions-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px 12px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        #sessions-list::-webkit-scrollbar { width: 4px; }
        #sessions-list::-webkit-scrollbar-thumb { background: var(--gold-dim); }

        .session-item {
            padding: 10px 12px;
            background: rgba(20, 15, 8, 0.6);
            border: 1px solid rgba(229, 193, 88, 0.1);
            border-left: 3px solid transparent;
            color: var(--text-muted);
            font-size: 16px;
            cursor: pointer;
            border-radius: 2px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: all 0.2s;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .session-item:hover {
            background: rgba(45, 33, 15, 0.7);
            color: var(--text-bright);
            border-color: rgba(229, 193, 88, 0.4);
            border-left-color: var(--gold);
        }
        .session-item.active {
            background: rgba(55, 40, 18, 0.85);
            color: var(--gold-bright);
            border-color: var(--border-hi);
            border-left-color: var(--gold-bright);
            box-shadow: inset 0 0 12px rgba(229,193,88,0.15);
        }
        .session-del-btn {
            opacity: 0;
            color: var(--red-bright);
            background: none;
            border: none;
            font-size: 14px;
            cursor: pointer;
            padding: 2px 6px;
            transition: opacity 0.2s;
        }
        .session-item:hover .session-del-btn { opacity: 0.8; }
        .session-del-btn:hover { opacity: 1; transform: scale(1.2); }

        /* ═══════════════════════════════
           MAIN SANCTUARY (CENTER VIEW)
           ═══════════════════════════════ */
        #main-view {
            flex: 1;
            height: 100%;
            position: relative;
            z-index: 60;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 24px 32px 20px;
            overflow: hidden;
        }

        /* Top HUD */
        .top-hud {
            width: 100%;
            max-width: 950px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }
        .hud-left, .hud-right {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .hud-location {
            font-family: 'Cinzel', serif;
            font-size: 13px;
            letter-spacing: 0.2rem;
            color: var(--gold-bright);
            text-shadow: 0 0 8px var(--gold-glow);
        }
        .hud-sub {
            font-size: 12px;
            letter-spacing: 0.2rem;
            color: var(--text-muted);
        }

        /* Souls HUD Bars */
        .hud-bars {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .hud-bar-row {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .hud-bar-label {
            font-size: 10px;
            color: var(--gold);
            width: 22px;
            text-align: right;
            font-weight: bold;
        }
        .hud-bar-track {
            width: 110px; height: 4px;
            background: rgba(0,0,0,0.8);
            border: 1px solid rgba(229,193,88,0.2);
            overflow: hidden;
        }
        .hud-bar-fill { height: 100%; transition: width 0.8s ease; }
        .hud-bar-fill.hp  { background: linear-gradient(to right, #9e1a1a, #ff3b3b); width: 100%; }
        .hud-bar-fill.fp  { background: linear-gradient(to right, #153275, #3d84ff); width: 85%; }
        .hud-bar-fill.sta { background: linear-gradient(to right, #1e5218, #4cd43b); width: 95%; }

        /* Runes / Model Info */
        .hud-runes {
            text-align: right;
            display: flex;
            align-items: center;
            gap: 8px;
            font-family: 'Cinzel', serif;
            font-size: 14px;
            color: var(--gold-bright);
        }

        /* Logo Area */
        .logo-wrap {
            position: relative;
            margin: 2px 0 6px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        #logo-img {
            width: 90px; height: 90px;
            object-fit: cover;
            border-radius: 50%;
            border: 2px solid var(--gold);
            box-shadow: 0 0 25px rgba(229, 193, 88, 0.4), inset 0 0 15px #000;
            image-rendering: pixelated;
        }
        .logo-ring {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            border-radius: 50%; border: 1px solid rgba(229,193,88,0.3);
            pointer-events: none; animation: ringPulse 4s infinite alternate;
        }
        .logo-ring:nth-child(2) { width: 104px; height: 104px; }
        .logo-ring:nth-child(3) { width: 120px; height: 120px; border-color: rgba(229,193,88,0.15); animation-delay: 1s; }
        @keyframes ringPulse { 0% { transform: translate(-50%,-50%) scale(1); opacity: 0.4; } 100% { transform: translate(-50%,-50%) scale(1.05); opacity: 0.9; } }

        .logo-title {
            font-family: 'Cinzel', serif;
            font-size: 1.4rem;
            letter-spacing: 0.5rem;
            color: var(--gold-bright);
            text-transform: uppercase;
            margin-top: 6px;
            text-shadow: 0 0 20px var(--gold-glow);
        }

        /* ═══════════════════════════════
           CHAT SANCTUARY (CONTENT)
           ═══════════════════════════════ */
        .chat-panel {
            width: 100%;
            max-width: 950px;
            flex: 1;
            display: flex;
            flex-direction: column;
            margin-bottom: 8px;
            overflow: hidden;
        }

        #chatbox {
            flex: 1;
            background: var(--panel);
            border: 1px solid var(--border);
            padding: 22px 28px;
            overflow-y: auto;
            position: relative;
            border-radius: 3px;
            box-shadow: inset 0 0 40px rgba(0,0,0,0.85);
            backdrop-filter: blur(10px);
        }
        #chatbox::-webkit-scrollbar { width: 6px; }
        #chatbox::-webkit-scrollbar-thumb { background: var(--gold-dim); border-radius: 3px; }

        /* Elden Frame Corners */
        #chatbox::before, #chatbox::after {
            content: ''; position: absolute; width: 16px; height: 16px;
            border-color: var(--gold); border-style: solid; pointer-events: none;
        }
        #chatbox::before { top:0; left:0; border-width: 2px 0 0 2px; }
        #chatbox::after  { top:0; right:0; border-width: 2px 2px 0 0; }

        .chat-msg {
            margin-bottom: 22px;
            line-height: 1.6;
            animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }

        .chat-msg.user {
            background: rgba(229, 193, 88, 0.05);
            border-left: 3px solid var(--gold);
            padding: 10px 16px;
            border-radius: 0 4px 4px 0;
        }
        .chat-msg.assistant {
            background: rgba(0,0,0,0.4);
            border-left: 3px solid var(--gold-bright);
            padding: 14px 18px;
            border-radius: 0 4px 4px 0;
        }

        .msg-sender {
            font-family: 'Cinzel', serif;
            font-size: 13px;
            letter-spacing: 0.15rem;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .user .msg-sender { color: var(--gold); }
        .assistant .msg-sender { color: var(--gold-bright); text-shadow: 0 0 10px var(--gold-glow); }

        .msg-body {
            font-size: 21px;
            color: var(--text-bright);
        }
        .user .msg-body { color: #fceecb; }

        /* Markdown Styling inside Responses */
        .msg-body h1, .msg-body h2, .msg-body h3 {
            font-family: 'Cinzel', serif;
            color: var(--gold-bright);
            margin: 14px 0 8px;
            letter-spacing: 0.05rem;
        }
        .msg-body p { margin-bottom: 10px; }
        .msg-body pre {
            background: #040302;
            border: 1px solid var(--border);
            border-left: 4px solid var(--gold);
            padding: 14px;
            margin: 12px 0;
            overflow-x: auto;
            border-radius: 3px;
        }
        .msg-body code {
            color: #ffea79;
            font-family: 'VT323', monospace;
            font-size: 20px;
        }
        .msg-body ul, .msg-body ol { padding-left: 24px; margin-bottom: 10px; }
        .msg-body li { margin-bottom: 4px; }
        .msg-body strong { color: var(--gold-bright); font-weight: bold; }
        .msg-body a { color: var(--gold); text-decoration: underline; }

        .empty-state {
            font-family: 'IM Fell English', serif;
            font-style: italic;
            color: var(--text-muted);
            font-size: 22px;
            text-align: center;
            margin-top: 80px;
            opacity: 0.7;
            animation: breathe 5s ease-in-out infinite;
        }
        @keyframes breathe { 0%,100%{opacity:0.4} 50%{opacity:0.9} }

        /* ═══════════════════════════════
           ATTACHMENTS BAR & PILLS
           ═══════════════════════════════ */
        #attachments-preview {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 8px;
            width: 100%;
            max-width: 950px;
        }
        .att-pill {
            background: rgba(229,193,88,0.15);
            border: 1px solid var(--gold);
            color: var(--gold-bright);
            font-size: 14px;
            padding: 4px 10px;
            border-radius: 3px;
            display: flex;
            align-items: center;
            gap: 8px;
            backdrop-filter: blur(5px);
        }
        .att-pill .del {
            cursor: pointer;
            color: var(--red-bright);
            font-weight: bold;
        }

        /* ═══════════════════════════════
           INVOCATION INPUT BAR
           ═══════════════════════════════ */
        .input-box-container {
            width: 100%;
            max-width: 950px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .input-row {
            display: flex;
            align-items: center;
            background: var(--panel-deep);
            border: 2px solid var(--border);
            border-radius: 3px;
            transition: border-color 0.3s, box-shadow 0.3s;
            position: relative;
        }
        .input-row:focus-within {
            border-color: var(--gold);
            box-shadow: 0 0 20px rgba(229, 193, 88, 0.25);
        }

        /* The + Plus Sign Button */
        .btn-plus {
            width: 52px; height: 52px;
            background: rgba(229,193,88,0.08);
            border: none;
            border-right: 1px solid var(--border);
            color: var(--gold-bright);
            font-size: 26px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }
        .btn-plus:hover {
            background: rgba(229,193,88,0.25);
            color: #ffffff;
            text-shadow: 0 0 10px var(--gold);
        }

        /* Expandable Action Menu for + */
        #plus-menu {
            position: absolute;
            bottom: 60px;
            left: 0;
            background: #110d07;
            border: 1px solid var(--gold);
            border-radius: 4px;
            padding: 8px;
            display: none;
            flex-direction: column;
            gap: 6px;
            z-index: 100;
            box-shadow: 0 0 25px rgba(0,0,0,0.9);
        }
        #plus-menu.show { display: flex; }
        .plus-option {
            background: rgba(255,255,255,0.04);
            border: 1px solid transparent;
            color: var(--gold-bright);
            font-family: 'Cinzel', serif;
            font-size: 13px;
            padding: 8px 14px;
            cursor: pointer;
            text-align: left;
            border-radius: 2px;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s;
        }
        .plus-option:hover {
            background: rgba(229,193,88,0.2);
            border-color: var(--gold);
            color: #fff;
        }

        #query {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-bright);
            padding: 14px 18px;
            font-family: 'VT323', monospace;
            font-size: 24px;
            outline: none;
            caret-color: var(--gold-bright);
        }
        #query::placeholder {
            color: var(--text-muted);
            font-family: 'IM Fell English', serif;
            font-style: italic;
            font-size: 20px;
        }

        .btn-send {
            background: rgba(229, 193, 88, 0.12);
            border: none;
            border-left: 1px solid var(--border);
            color: var(--gold-bright);
            font-family: 'Cinzel', serif;
            font-size: 14px;
            letter-spacing: 0.15rem;
            padding: 0 24px;
            height: 52px;
            cursor: pointer;
            transition: all 0.25s;
        }
        .btn-send:hover {
            background: rgba(229, 193, 88, 0.3);
            color: #ffffff;
            text-shadow: 0 0 12px var(--gold-glow);
        }

        /* Status Bar */
        .status-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 4px;
            font-size: 13px;
            color: var(--text-muted);
            letter-spacing: 0.15rem;
        }
        .progress-track {
            flex: 1; height: 2px;
            background: rgba(229,193,88,0.1);
            margin: 0 16px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%; width: 100%;
            background: linear-gradient(to right, var(--gold-dim), var(--gold-bright));
            transition: width 0.5s ease;
        }

        /* Hidden File Input */
        #hidden-file-input { display: none; }

        /* Mobile Sidebar Toggle */
        .sidebar-toggle-btn {
            display: none;
            background: rgba(229,193,88,0.15);
            border: 1px solid var(--gold);
            color: var(--gold-bright);
            padding: 8px; margin-right: 10px; cursor: pointer;
        }
        @media (max-width: 800px) {
            .sidebar-toggle-btn { display: block; }
            #sidebar {
                position: fixed; left: -290px; z-index: 1000;
            }
            #sidebar.open { left: 0; }
        }
    </style>
</head>
<body>

    <!-- Fog and Erdtree Atmosphere -->
    <div class="bg-sky"></div>
    <div class="bg-fog" id="fogLayer"></div>
    <div class="bg-erdtree"></div>
    <div class="bg-erdtree-wide"></div>
    <div class="layer-scanlines"></div>
    <div class="layer-vignette"></div>

    <!-- ═══════════════════════════════
         SIDEBAR: SESSIONS CHRONICLE
         ═══════════════════════════════ -->
    <div id="sidebar">
        <div class="sidebar-header">
            <div class="sidebar-title"><span>⚜</span> CHRONICLES</div>
        </div>
        <button class="btn-new-session" id="btn-new-chat">
            <span>+</span> NEW CONVERSATION
        </button>
        <div id="sessions-list">
            <!-- Dynamic session items inserted here -->
        </div>
    </div>

    <!-- ═══════════════════════════════
         MAIN VIEW (SANCTUARY)
         ═══════════════════════════════ -->
    <div id="main-view">
        <button class="sidebar-toggle-btn" onclick="document.getElementById('sidebar').classList.toggle('open')">☰</button>
        <!-- Top HUD -->
        <div class="top-hud">
            <div class="hud-left">
                <div class="hud-bars">
                    <div class="hud-bar-row">
                        <span class="hud-bar-label">HP</span>
                        <div class="hud-bar-track"><div class="hud-bar-fill hp" id="hpBar"></div></div>
                    </div>
                    <div class="hud-bar-row">
                        <span class="hud-bar-label">FP</span>
                        <div class="hud-bar-track"><div class="hud-bar-fill fp" id="fpBar"></div></div>
                    </div>
                    <div class="hud-bar-row">
                        <span class="hud-bar-label">STA</span>
                        <div class="hud-bar-track"><div class="hud-bar-fill sta" id="staBar"></div></div>
                    </div>
                </div>
                <div>
                    <div class="hud-location">THE GREAT SANCTUARY</div>
                    <div class="hud-sub">ELDEN RING // SILURIA ARCHIVE</div>
                </div>
            </div>

            <div class="hud-right">
                <div class="hud-runes">
                    <span>⚜</span> <button id="btn-login" style="background:transparent; border:1px solid rgba(229, 193, 88, 0.5); padding: 4px 12px; font-family:'Cinzel', serif; color:var(--gold-bright); font-size:12px; letter-spacing:0.15rem; cursor:pointer; text-shadow:0 0 5px var(--gold-glow); transition:all 0.3s; border-radius:2px;">KINDLE BONFIRE (LOGIN)</button>
                </div>
            </div>
        </div>

        <!-- Logo -->
        <div class="logo-wrap">
            <div class="logo-ring"></div>
            <div class="logo-ring"></div>
            <div class="logo-ring"></div>
            <img id="logo-img" src="/logo" alt="Siluria Knight" onerror="this.style.display='none'">
            <div class="logo-title">S I L U R I A</div>
        </div>

        <!-- Chat History -->
        <div class="chat-panel">
            <div id="chatbox">
                <div class="empty-state">
                    "The grace burns bright. Speak thy inquiry, and knowledge shall be bestowed."
                </div>
            </div>
        </div>

        <!-- Attachments Preview Area -->
        <div id="attachments-preview"></div>

        <!-- Invocation / Input Area -->
        <div class="input-box-container">
            <div class="input-row">
                <!-- Expandable Plus Menu -->
                <div id="plus-menu">
                    <button class="plus-option" id="opt-upload-file">📁 Upload File / Document</button>
                    <button class="plus-option" id="opt-upload-image">🖼 Upload Image</button>
                    <button class="plus-option" id="opt-add-link">🔗 Attach Web Link</button>
                </div>

                <button class="btn-plus" id="btn-plus" title="Add File, Image, or Web Link">+</button>
                <input type="text" id="query" placeholder="Speak thy inquiry, Tarnished..." autocomplete="off" spellcheck="false">
                <button class="btn-send" id="btn-send">INVOKE</button>
            </div>

            <div class="status-row">
                <span>ALL TOOLS ARMED</span>
                <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
                <span id="status-text">AWAITING INPUT</span>
            </div>
        </div>

    </div>

    <!-- Hidden file inputs -->
    <input type="file" id="hidden-file-input" multiple>

    <!-- Login Modal -->
    <div id="login-modal">
        <div class="login-box">
            <button class="btn-close-modal" id="btn-close-login">✕</button>
            <div class="login-title">KINDLE THE GRACE</div>
            <input type="text" class="login-input" placeholder="Tarnished Name" spellcheck="false" autocomplete="off">
            <input type="password" class="login-input" placeholder="Passphrase" autocomplete="off">
            <button class="btn-auth" id="btn-auth-submit">ENTER SANCTUARY</button>
        </div>
    </div>

    <script>
    /* ─────────────────────────────────────────
       FOG GENERATOR
    ───────────────────────────────────────── */
    const fogLayer = document.getElementById('fogLayer');
    const fogDefs = [
        { top: '60%',  h: '30%', col: 'rgba(40,28,10,0.55)',  spd: '16s', a0: 0.5, a1: 0.8 },
        { top: '72%',  h: '20%', col: 'rgba(30,20,8,0.45)',   spd: '22s', a0: 0.4, a1: 0.7 },
        { top: '80%',  h: '16%', col: 'rgba(25,16,5,0.60)',   spd: '12s', a0: 0.6, a1: 0.9 },
    ];
    fogDefs.forEach((f, i) => {
        const el = document.createElement('div');
        el.className = 'fog-band';
        el.style.top = f.top;
        el.style.height = f.h;
        el.style.setProperty('--col', f.col);
        el.style.setProperty('--spd', f.spd);
        el.style.setProperty('--a0', f.a0);
        el.style.setProperty('--a1', f.a1);
        el.style.animationDelay = (i * 2.5) + 's';
        fogLayer.appendChild(el);
    });

    /* ─────────────────────────────────────────
       STATE & DATABASE MANAGEMENT
       ───────────────────────────────────────── */
    let currentSessionId = "";
    let attachedFileIds = [];
    let attachedLinks = [];

    const chatbox = document.getElementById('chatbox');
    const queryEl = document.getElementById('query');
    const sendBtn = document.getElementById('btn-send');
    const sessionsList = document.getElementById('sessions-list');
    const statusText = document.getElementById('status-text');
    const progressFill = document.getElementById('progressFill');
    const plusBtn = document.getElementById('btn-plus');
    const plusMenu = document.getElementById('plus-menu');
    const fileInput = document.getElementById('hidden-file-input');
    const attPreview = document.getElementById('attachments-preview');

    // Login Modal Logic
    const loginModal = document.getElementById('login-modal');
    document.getElementById('btn-login').onclick = () => loginModal.classList.add('show');
    document.getElementById('btn-close-login').onclick = () => loginModal.classList.remove('show');
    document.getElementById('btn-auth-submit').onclick = () => {
        loginModal.classList.remove('show');
        document.getElementById('btn-login').innerHTML = 'GRACE KINDLED (LOGGED IN)';
    };
    loginModal.onclick = (e) => {
        if (e.target === loginModal) loginModal.classList.remove('show');
    };

    // Toggle Plus Menu
    plusBtn.onclick = (e) => {
        e.stopPropagation();
        plusMenu.classList.toggle('show');
    };
    document.addEventListener('click', () => plusMenu.classList.remove('show'));

    document.getElementById('opt-upload-file').onclick = () => fileInput.click();
    document.getElementById('opt-upload-image').onclick = () => {
        fileInput.accept = "image/*";
        fileInput.click();
    };
    document.getElementById('opt-add-link').onclick = () => {
        const link = prompt("Enter web URL to attach:");
        if (link && link.trim()) {
            attachedLinks.push(link.trim());
            renderAttachments();
        }
    };

    // Upload Handler
    fileInput.onchange = async () => {
        if (!fileInput.files.length) return;
        const formData = new FormData();
        formData.append("session_id", currentSessionId);
        for (let i = 0; i < fileInput.files.length; i++) {
            formData.append("files", fileInput.files[i]);
        }
        statusText.textContent = "UPLOADING ARTIFACTS...";
        try {
            const res = await fetch('/api/upload', { method: 'POST', body: formData });
            const data = await res.json();
            if (data.files) {
                data.files.forEach(f => attachedFileIds.push(f));
                renderAttachments();
            }
        } catch (e) {
            alert("Upload failed: " + e);
        }
        statusText.textContent = "AWAITING INPUT";
        fileInput.value = "";
    };

    function renderAttachments() {
        attPreview.innerHTML = "";
        attachedFileIds.forEach((f, idx) => {
            const div = document.createElement('div');
            div.className = 'att-pill';
            div.innerHTML = `<span>📁 ${f.filename}</span> <span class="del" onclick="removeAtt(${idx})">×</span>`;
            attPreview.appendChild(div);
        });
        attachedLinks.forEach((l, idx) => {
            const div = document.createElement('div');
            div.className = 'att-pill';
            div.innerHTML = `<span>🔗 ${l}</span> <span class="del" onclick="removeLink(${idx})">×</span>`;
            attPreview.appendChild(div);
        });
    }

    window.removeAtt = (idx) => { attachedFileIds.splice(idx, 1); renderAttachments(); };
    window.removeLink = (idx) => { attachedLinks.splice(idx, 1); renderAttachments(); };

    /* ─────────────────────────────────────────
       LOAD SESSIONS & MESSAGES FROM DATABASE
       ───────────────────────────────────────── */
    async function fetchSessions() {
        try {
            const res = await fetch('/api/sessions');
            const data = await res.json();
            sessionsList.innerHTML = "";
            data.sessions.forEach(s => {
                const div = document.createElement('div');
                div.className = `session-item ${s.id === currentSessionId ? 'active' : ''}`;
                div.innerHTML = `
                    <span style="overflow:hidden;text-overflow:ellipsis;">${s.title}</span>
                    <button class="session-del-btn" onclick="event.stopPropagation(); deleteSession('${s.id}')">✕</button>
                `;
                div.onclick = () => loadSession(s.id);
                sessionsList.appendChild(div);
            });
        } catch (e) { console.error("Session load error:", e); }
    }

    async function loadSession(sid) {
        currentSessionId = sid;
        await fetchSessions();
        try {
            const res = await fetch(`/api/sessions/${sid}`);
            const data = await res.json();
            chatbox.innerHTML = "";
            if (data.messages && data.messages.length > 0) {
                data.messages.forEach(m => {
                    appendMessage(m.role, m.content);
                });
            } else {
                chatbox.innerHTML = `<div class="empty-state">"The chronicle is blank. Speak, and let history be written."</div>`;
            }
            chatbox.scrollTop = chatbox.scrollHeight;
        } catch (e) { console.error("Load messages error:", e); }
    }

    window.deleteSession = async (sid) => {
        if (!confirm("Banish this chronicle permanently?")) return;
        await fetch(`/api/sessions/${sid}`, { method: 'DELETE' });
        if (currentSessionId === sid) {
            currentSessionId = "";
            chatbox.innerHTML = `<div class="empty-state">"Choose or forge a new chronicle from the sidebar."</div>`;
        }
        fetchSessions();
    };

    document.getElementById('btn-new-chat').onclick = async () => {
        const res = await fetch('/api/sessions', { method: 'POST' });
        const s = await res.json();
        loadSession(s.id);
    };

    function appendMessage(role, text) {
        const isUser = role === 'user';
        const div = document.createElement('div');
        div.className = `chat-msg ${isUser ? 'user' : 'assistant'}`;
        div.innerHTML = `
            <div class="msg-sender">${isUser ? '⚔ TARNISHED' : '⚜ SILURIA'}</div>
            <div class="msg-body">${marked.parse(text)}</div>
        `;
        chatbox.appendChild(div);
        chatbox.scrollTop = chatbox.scrollHeight;
    }

    /* ─────────────────────────────────────────
       INSTANT STREAMING INVOCATION
       ───────────────────────────────────────── */
    async function invokeAgent() {
        const text = queryEl.value.trim();
        if (!text && attachedFileIds.length === 0 && attachedLinks.length === 0) return;

        // Clean initial empty state
        const emptyEl = chatbox.querySelector('.empty-state');
        if (emptyEl) emptyEl.remove();

        queryEl.value = "";
        queryEl.disabled = true;
        sendBtn.disabled = true;
        statusText.textContent = "COMMUNING...";
        progressFill.style.width = "30%";

        // Show User Message
        appendMessage('user', text);

        // Prep Assistant Container for Streaming
        const assistDiv = document.createElement('div');
        assistDiv.className = 'chat-msg assistant';
        assistDiv.innerHTML = `
            <div class="msg-sender">⚜ SILURIA</div>
            <div class="msg-body" id="streaming-target"></div>
        `;
        chatbox.appendChild(assistDiv);
        const streamTarget = document.getElementById('streaming-target');

        const payload = {
            query: text,
            session_id: currentSessionId,
            links: attachedLinks,
            file_ids: attachedFileIds.map(f => f.id)
        };

        // Reset attachments
        attachedFileIds = [];
        attachedLinks = [];
        renderAttachments();

        try {
            const res = await fetch('/api/chat/stream', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            const reader = res.body.getReader();
            const decoder = new TextDecoder();
            let fullText = "";

            while (true) {
                const { done, value } = await reader.read();
                if (done) break;
                const chunk = decoder.decode(value);
                fullText += chunk;
                streamTarget.innerHTML = marked.parse(fullText);
                chatbox.scrollTop = chatbox.scrollHeight;
                progressFill.style.width = "85%";
            }

            streamTarget.removeAttribute('id');
            progressFill.style.width = "100%";
            statusText.textContent = "IDLE";
            fetchSessions();
        } catch (e) {
            streamTarget.innerHTML = `<span style="color:var(--red-bright);">Connection Severed: ${e}</span>`;
            statusText.textContent = "ERROR";
        }

        queryEl.disabled = false;
        sendBtn.disabled = false;
        queryEl.focus();
    }

    sendBtn.onclick = invokeAgent;
    queryEl.onkeypress = (e) => {
        if (e.key === 'Enter') invokeAgent();
    };

    // Initialize Sessions on Boot
    fetchSessions().then(async () => {
        const res = await fetch('/api/sessions');
        const data = await res.json();
        if (data.sessions.length > 0) {
            loadSession(data.sessions[0].id);
        } else {
            document.getElementById('btn-new-chat').click();
        }
    });
    </script>
</body>
</html>
