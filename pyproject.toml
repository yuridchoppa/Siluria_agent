[project]
name = "siluria-agent"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110.0",
    "google-genai>=0.1.0",
    "uvicorn>=0.28.0",
    "python-multipart>=0.0.9",
    "python-dotenv>=1.0.0",
    "pydantic>=2.6.0",
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "duckduckgo-search>=5.0.0",
    "sympy>=1.12.0",
    "aiofiles>=23.0.0",
]

[tool.vercel]
entrypoint = "main:app"
